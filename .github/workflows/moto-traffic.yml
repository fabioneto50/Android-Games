name: Build Moto Traffic Android

on:
  push:
    paths:
      - 'MotoTraffic/**'
      - '.github/workflows/moto-traffic.yml'
  pull_request:
    paths:
      - 'MotoTraffic/**'
      - '.github/workflows/moto-traffic.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Build debug APK
        working-directory: MotoTraffic
        run: gradle :app:assembleDebug --stacktrace

      - name: Prepare installable APK
        run: cp MotoTraffic/app/build/outputs/apk/debug/app-debug.apk MotoTraffic-Reborn.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MotoTraffic-Reborn-APK
          path: MotoTraffic-Reborn.apk
          retention-days: 90
