name: Build Android Apps

on:
  push:
    paths:
      - 'MotoTraffic/**'
      - 'clinical-android/**'
      - '.github/workflows/moto-traffic.yml'
  pull_request:
    paths:
      - 'MotoTraffic/**'
      - 'clinical-android/**'
      - '.github/workflows/moto-traffic.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  clinical:
    if: github.ref == 'refs/heads/build-clinical-android' || github.head_ref == 'build-clinical-android'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-37" "build-tools;36.0.0"

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Restore Clinical Android source
        run: |
          rm -rf clinical-android/work
          mkdir -p clinical-android/work
          cat clinical-android/source/part_*.b64 | base64 --decode | tar -xzf - -C clinical-android/work

      - name: Build Clinical debug APK
        working-directory: clinical-android/work/ClinicalAndroid
        run: gradle :app:assembleDebug --stacktrace

      - name: Prepare Clinical APK
        run: |
          mkdir -p clinical-android/dist
          cp clinical-android/work/ClinicalAndroid/app/build/outputs/apk/debug/app-debug.apk clinical-android/dist/ClinicalAndroid-debug.apk

      - name: Upload Clinical APK
        uses: actions/upload-artifact@v4
        with:
          name: ClinicalAndroid-debug-apk
          path: clinical-android/dist/ClinicalAndroid-debug.apk
          retention-days: 90

      - name: Publish APK to branch
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f clinical-android/dist/ClinicalAndroid-debug.apk
          if ! git diff --cached --quiet; then
            git commit -m "Build Clinical Android debug APK"
            git push
          fi

  moto-traffic:
    if: github.ref != 'refs/heads/build-clinical-android' && github.head_ref != 'build-clinical-android'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Build debug APK
        working-directory: MotoTraffic
        run: gradle :app:assembleDebug --stacktrace
      - name: Prepare installable APK
        run: cp MotoTraffic/app/build/outputs/apk/debug/app-debug.apk MotoTraffic-Reborn.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MotoTraffic-Reborn-APK
          path: MotoTraffic-Reborn.apk
          retention-days: 90
