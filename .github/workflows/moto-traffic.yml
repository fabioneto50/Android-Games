name: Build Moto Traffic Android

on:
  push:
    paths:
      - 'MotoTraffic/**'
      - 'staging/GameView.java.gz.b64'
      - '.github/workflows/moto-traffic.yml'
  pull_request:
    paths:
      - 'MotoTraffic/**'
      - 'staging/GameView.java.gz.b64'
      - '.github/workflows/moto-traffic.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}

      - name: Restore GameView source
        if: ${{ hashFiles('MotoTraffic/app/src/main/java/com/fabioneto/androidgames/mototraffic/GameView.java') == '' }}
        run: |
          base64 -d staging/GameView.java.gz.b64 > /tmp/GameView.java.gz
          gzip -dc /tmp/GameView.java.gz > MotoTraffic/app/src/main/java/com/fabioneto/androidgames/mototraffic/GameView.java

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Build debug APK
        working-directory: MotoTraffic
        run: gradle :app:assembleDebug --stacktrace

      - name: Commit restored source
        if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/import/moto-traffic') || (github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'import/moto-traffic') }}
        run: |
          if [ -f staging/GameView.java.gz.b64 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- MotoTraffic/app/src/main/java/com/fabioneto/androidgames/mototraffic/GameView.java
            git rm -- staging/GameView.java.gz.b64
            git commit -m "Restore Moto Traffic GameView source"
            git push origin HEAD:import/moto-traffic
          fi

      - name: Prepare installable APK
        run: cp MotoTraffic/app/build/outputs/apk/debug/app-debug.apk MotoTraffic-Reborn.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MotoTraffic-Reborn-APK
          path: MotoTraffic-Reborn.apk
          retention-days: 90
