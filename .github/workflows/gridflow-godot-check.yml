name: GRIDFLOW Godot Check

on:
  push:
    paths:
      - 'GridFlow/**'
      - '.github/workflows/gridflow-godot-check.yml'
  pull_request:
    paths:
      - 'GridFlow/**'
      - '.github/workflows/gridflow-godot-check.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: '4.4.1'
          use-dotnet: false

      - name: Import and parse project
        run: godot --headless --path GridFlow --editor --quit
