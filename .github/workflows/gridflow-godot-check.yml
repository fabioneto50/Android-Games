name: GRIDFLOW Godot Check

on:
  push:
    paths:
      - 'GridFlow/**'
      - '.github/workflows/gridflow-godot-check.yml'
  pull_request:
    paths:
      - 'GridFlow/**'
      - '.github/workflows/gridflow-godot-check.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: '4.4.1'
          use-dotnet: false
          include-templates: true

      - name: Import and parse project
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path GridFlow --editor --quit 2>&1 | tee godot.log
          if grep -E "SCRIPT ERROR|Parse Error|Compile Error|ERROR: Failed to load script" godot.log; then
            echo "Godot reported script errors."
            exit 1
          fi

      - name: Runtime smoke test
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path GridFlow --quit-after 240 2>&1 | tee runtime.log
          if grep -E "SCRIPT ERROR|Parse Error|Compile Error|Invalid call|Invalid access|ERROR: Failed to load script" runtime.log; then
            echo "GRIDFLOW reported runtime errors."
            exit 1
          fi

      - name: Export Web build
        shell: bash
        run: |
          mkdir -p GridFlow/build/web
          godot --headless --path GridFlow --export-release Web
          test -f GridFlow/build/web/index.html

      - name: Upload playable Web build
        uses: actions/upload-artifact@v4
        with:
          name: gridflow-web
          path: GridFlow/build/web
          if-no-files-found: error
          retention-days: 14
