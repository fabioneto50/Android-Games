name: Build Clinical Android APK

on:
  push:
    branches:
      - build-clinical-android
    paths:
      - "clinical-android/source/**"
      - ".github/workflows/clinical-android-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 37 SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-37" "build-tools;36.0.0" "platform-tools"

      - name: Install Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      - name: Restore Clinical Android source
        run: |
          rm -rf clinical-android/work
          mkdir -p clinical-android/work
          cat clinical-android/source/part_*.b64 | base64 --decode | tar -xzf - -C clinical-android/work

      - name: Build debug APK
        working-directory: clinical-android/work/ClinicalAndroid
        run: gradle :app:assembleDebug --stacktrace

      - name: Publish APK into build branch
        run: |
          mkdir -p clinical-android/dist
          cp clinical-android/work/ClinicalAndroid/app/build/outputs/apk/debug/app-debug.apk clinical-android/dist/ClinicalAndroid-debug.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f clinical-android/dist/ClinicalAndroid-debug.apk
          if git diff --cached --quiet; then
            echo "APK unchanged"
          else
            git commit -m "Build Clinical Android debug APK"
            git push
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ClinicalAndroid-debug-apk
          path: clinical-android/dist/ClinicalAndroid-debug.apk
          if-no-files-found: error
          retention-days: 30
